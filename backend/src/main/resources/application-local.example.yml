# 本地开发配置示例。
# 使用方式：复制为 application-local.yml，然后按自己的本机环境修改。

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/novel_player?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:novel}
    password: ${SPRING_DATASOURCE_PASSWORD:novel_pass}
  flyway:
    enabled: true
    # 本地库可能曾经被手工建过表，开启基线迁移方便 Flyway 接管已有结构。
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  ai:
    model:
      # 默认关闭真实模型客户端，走模拟生成。
      # 接入 DeepSeek 时，将聊天模型开关设为 openai。
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: ${SPRING_AI_MODEL_IMAGE:none}
      moderation: ${SPRING_AI_MODEL_MODERATION:none}
      audio:
        speech: ${SPRING_AI_MODEL_AUDIO_SPEECH:none}
        transcription: ${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        completions-path: ${DEEPSEEK_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
          temperature: ${DEEPSEEK_TEMPERATURE:0.4}
          response-format:
            type: JSON_OBJECT

management:
  endpoints:
    web:
      exposure:
        include: health,info

novel-player:
  ai:
    deepseek:
      # DeepSeek 专用参数：disabled 会在请求 extraBody 中注入 thinking.type=disabled；
      # default 则不注入该字段，保留服务端默认行为。
      thinking-mode: ${NOVEL_PLAYER_DEEPSEEK_THINKING_MODE:disabled}
  generation:
    minimum-chapters: ${NOVEL_PLAYER_MINIMUM_CHAPTERS:3}
    # 生成管线模式：staged 为多阶段生成，legacy 为旧的一次性生成链路。
    pipeline-mode: ${NOVEL_PLAYER_GENERATION_PIPELINE_MODE:staged}
    # 默认使用模拟生成，保证没有模型密钥也能启动。
    # 接入 DeepSeek 时改成 false。
    mock-ai: ${NOVEL_PLAYER_MOCK_AI:true}
    # 章节摘要彼此无依赖，默认有界并行；按模型限流和数据库连接池大小调整。
    chapter-digest-concurrency: ${NOVEL_PLAYER_CHAPTER_DIGEST_CONCURRENCY:4}
    # 1 表示严格串行并使用上一场实际生成摘要；大于 1 时使用上一场规划摘要以支持并行。
    scene-draft-concurrency: ${NOVEL_PLAYER_SCENE_DRAFT_CONCURRENCY:2}
