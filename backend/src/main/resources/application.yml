server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    # 开发工具直接启动时默认使用本地配置；容器部署会用环境变量覆盖为 test。
    default: local
  application:
    name: novel-player
  ai:
    model:
      # 默认不装配真实模型，避免无模型密钥时 Spring AI 自动配置失败。
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: ${SPRING_AI_MODEL_IMAGE:none}
      moderation: ${SPRING_AI_MODEL_MODERATION:none}
      audio:
        speech: ${SPRING_AI_MODEL_AUDIO_SPEECH:none}
        transcription: ${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        completions-path: /chat/completions
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
          temperature: ${DEEPSEEK_TEMPERATURE:0.4}
          response-format:
            type: JSON_OBJECT

management:
  endpoints:
    web:
      exposure:
        include: health,info

novel-player:
  generation:
    minimum-chapters: ${NOVEL_PLAYER_MINIMUM_CHAPTERS:3}
    pipeline-mode: ${NOVEL_PLAYER_GENERATION_PIPELINE_MODE:staged}
    mock-ai: ${NOVEL_PLAYER_MOCK_AI:true}
